<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الطالب | لغتي لغة الضاد</title>

<link rel="stylesheet" href="style-new.css">

<style>

.student-page{
    width:90%;
    max-width:1200px;
    margin:45px auto;
}

.welcome-box{
    background:white;
    border-radius:35px;
    padding:45px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
    margin-bottom:35px;
}

.welcome-box h1{
    color:#1e40af;
    font-size:40px;
    margin-bottom:15px;
}

.welcome-box p{
    font-size:19px;
    color:#64748b;
    line-height:2;
}

.student-name{
    color:#d4a017;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:35px;
}

.stat{
    background:white;
    padding:30px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.07);
}

.stat-icon{
    font-size:40px;
}

.stat-number{
    font-size:35px;
    font-weight:bold;
    color:#1e40af;
    margin:10px;
}

.panel{
    background:white;
    padding:30px;
    border-radius:30px;
    box-shadow:0 15px 35px rgba(0,0,0,.07);
    margin-bottom:30px;
}

.panel h2{
    color:#1e40af;
    margin-bottom:25px;
}

.progress-container{
    background:#e2e8f0;
    height:18px;
    border-radius:50px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#1e40af;
    transition:1s;
}

.lessons-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.lesson-card{
    background:#f8fafc;
    border-radius:25px;
    padding:25px;
    border:2px solid transparent;
    transition:.3s;
}

.lesson-card:hover{
    transform:translateY(-7px);
    border-color:#dbeafe;
}

.lesson-icon{
    font-size:45px;
    margin-bottom:12px;
}

.lesson-card h3{
    color:#1e40af;
    font-size:22px;
    margin-bottom:10px;
}

.lesson-card p{
    color:#64748b;
    line-height:1.8;
}

.lesson-info{
    font-size:14px;
    color:#64748b;
    margin-bottom:10px;
}

.open-lesson{
    display:inline-block;
    margin-top:15px;
    background:#1e40af;
    color:white;
    padding:11px 20px;
    border-radius:13px;
    text-decoration:none;
}

.empty{
    text-align:center;
    padding:40px;
    color:#64748b;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:1fr;
    }

    .welcome-box h1{
        font-size:30px;
    }

}

</style>

</head>

<body>

<a href="student.html">لوحة الطالب</a>

<a href="support.html">الدعم</a>

</div>

</nav>


<main class="student-page">

<h1>
أهلًا بك

</h1>

<p>
مرحبًا بك في لوحة الطالب في منصة
<strong>لغتي لغة الضاد</strong>.
<br>
تابع دروسك، حل الاختبارات، وسجل تقدمك خطوة بخطوة.
</p>

</section>


<!-- الإحصائيات -->

<section class="stats">


<div class="stat">

<div class="stat-icon">📚</div>

<div id="lessonCount" class="stat-number">
0
</div>

<div>
الدروس المتاحة
</div>

</div>


<div class="stat">

<div class="stat-icon">✅</div>

<div id="completedCount" class="stat-number">
0
</div>

<div>
الدروس المكتملة
</div>

</div>


<div class="stat">

<div class="stat-icon">🏆</div>

<div id="quizScore" class="stat-number">
0
</div>

<div>
آخر درجة
</div>

</div>


</section>

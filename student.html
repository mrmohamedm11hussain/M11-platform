<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة الطالب | لغتي لغة الضاد</title>

  <link rel="stylesheet" href="style-new.css">

  <style>

    :root{
      --blue:#1e40af;
      --blue2:#2563eb;
      --gold:#d4a017;
      --green:#16a34a;
      --dark:#0f172a;
      --muted:#64748b;
      --bg:#f8fafc;
      --white:#fff;
      --border:#e2e8f0;
      --shadow:0 12px 35px rgba(15,23,42,.08);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--dark);
      font-family:Tahoma,Arial,sans-serif;
    }

    /* =========================
       HEADER
    ========================== */

    .student-topbar{
      height:76px;
      background:#fff;
      border-bottom:1px solid var(--border);
      box-shadow:0 5px 20px rgba(15,23,42,.05);

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 28px;

      position:sticky;
      top:0;
      z-index:1000;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand img{
      width:48px;
      height:48px;
      object-fit:contain;
    }

    .brand-text{
      display:flex;
      flex-direction:column;
      gap:3px;
    }

    .brand-text strong{
      color:var(--blue);
      font-size:19px;
    }

    .brand-text span{
      color:var(--muted);
      font-size:12px;
    }

    .student-actions{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .student-name{
      color:#475569;
      font-size:14px;
    }

    .logout-btn{
      border:0;
      background:#fee2e2;
      color:#b91c1c;
      padding:10px 15px;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
    }

    /* =========================
       CONTAINER
    ========================== */

    .student-container{
      width:min(1200px,94%);
      margin:35px auto 70px;
    }

    .welcome-box{
      background:linear-gradient(
        135deg,
        #1e40af,
        #2563eb
      );

      color:#fff;

      border-radius:25px;

      padding:30px;

      margin-bottom:25px;

      box-shadow:0 18px 45px rgba(30,64,175,.20);

      position:relative;
      overflow:hidden;
    }

    .welcome-box::after{
      content:"";
      position:absolute;
      width:220px;
      height:220px;
      border-radius:50%;
      background:rgba(255,255,255,.08);
      left:-70px;
      top:-90px;
    }

    .welcome-box h1{
      margin:0 0 8px;
      font-size:29px;
      position:relative;
      z-index:1;
    }

    .welcome-box p{
      margin:0;
      color:#dbeafe;
      line-height:1.8;
      position:relative;
      z-index:1;
    }

    /* =========================
       STATS
    ========================== */

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      margin-bottom:28px;
    }

    .stat{
      background:#fff;
      border:1px solid var(--border);
      border-radius:20px;
      padding:22px;

      box-shadow:var(--shadow);

      display:flex;
      align-items:center;
      gap:15px;

      transition:.25s;
    }

    .stat:hover{
      transform:translateY(-3px);
    }

    .stat-icon{
      width:50px;
      height:50px;
      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#eff6ff;
      font-size:23px;
    }

    .stat:nth-child(2) .stat-icon{
      background:#f0fdf4;
    }

    .stat:nth-child(3) .stat-icon{
      background:#fffbeb;
    }

    .stat span{
      display:block;
      color:var(--muted);
      font-size:12px;
      margin-bottom:5px;
    }

    .stat strong{
      font-size:25px;
    }

    /* =========================
       LESSONS
    ========================== */

    .section-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
    }

    .section-header h2{
      margin:0;
      font-size:22px;
    }

    .section-header span{
      color:var(--muted);
      font-size:13px;
    }

    .lessons-grid{
      display:grid;
      grid-template-columns:
        repeat(auto-fill,minmax(280px,1fr));

      gap:18px;
    }

    .lesson-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:20px;

      overflow:hidden;

      box-shadow:var(--shadow);

      transition:.25s;
    }

    .lesson-card:hover{
      transform:translateY(-5px);
      box-shadow:0 18px 42px rgba(15,23,42,.12);
    }

    .lesson-top{
      background:#eff6ff;
      padding:22px;

      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .lesson-icon{
      width:48px;
      height:48px;
      background:#fff;
      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:23px;
    }

    .lesson-grade{
      background:#fff;
      color:var(--blue);
      border-radius:999px;
      padding:7px 10px;
      font-size:10px;
      font-weight:bold;
    }

    .lesson-body{
      padding:20px;
    }

    .lesson-body h3{
      margin:0 0 8px;
      font-size:17px;
      line-height:1.5;
    }

    .subject{
      color:var(--blue);
      font-size:12px;
      font-weight:bold;
      margin-bottom:9px;
    }

    .description{
      color:var(--muted);
      font-size:12px;
      line-height:1.8;

      min-height:43px;
    }

    .progress-area{
      margin-top:15px;
    }

    .progress-label{
      display:flex;
      justify-content:space-between;
      font-size:11px;
      color:var(--muted);
      margin-bottom:6px;
    }

    .progress{
      height:7px;
      background:#e2e8f0;
      border-radius:999px;
      overflow:hidden;
    }

    .progress-fill{
      height:100%;
      background:var(--blue);
      border-radius:999px;
      transition:width .4s;
    }

    .open-lesson{
      display:block;

      text-align:center;

      margin-top:16px;

      background:var(--blue);
      color:#fff;

      padding:12px;

      border-radius:12px;

      text-decoration:none;

      font-size:13px;
      font-weight:bold;

      transition:.2s;
    }

    .open-lesson:hover{
      background:#1d4ed8;
    }

    .completed{
      color:var(--green);
      font-weight:bold;
    }

    /* =========================
       EMPTY / LOADING
    ========================== */

    .state-box{
      background:#fff;
      border:1px solid var(--border);
      border-radius:20px;

      padding:45px 20px;

      text-align:center;

      color:var(--muted);

      box-shadow:var(--shadow);
    }

    /* =========================
       FOOTER
    ========================== */

    footer{
      text-align:center;
      color:#94a3b8;
      font-size:12px;
      padding:25px;
    }

    /* =========================
       MOBILE
    ========================== */

    @media(max-width:750px){

      .stats{
        grid-template-columns:1fr;
      }

    }

    @media(max-width:600px){

      .student-topbar{
        height:auto;
        min-height:70px;
        padding:12px 15px;
      }

      .brand img{
        width:42px;
        height:42px;
      }

      .brand-text strong{
        font-size:15px;
      }

      .brand-text span{
        font-size:10px;
      }

      .student-name{
        display:none;
      }

      .logout-btn{
        padding:9px 11px;
        font-size:12px;
      }

      .student-container{
        width:92%;
        margin-top:22px;
      }

      .welcome-box{
        padding:24px 20px;
      }

      .welcome-box h1{
        font-size:23px;
      }

      .lessons-grid{
        grid-template-columns:1fr;
      }

    }

  </style>

</head>

<body>

  <!-- HEADER -->

  <header class="student-topbar">

    <div class="brand">

      <img
        src="logo.svg"
        alt="لغتي لغة الضاد">

      <div class="brand-text">

        <strong>
          لغتي لغة الضاد
        </strong>

        <span>
          المنصة التعليمية
        </span>

      </div>

    </div>


    <div class="student-actions">

      <span
        class="student-name"
        id="studentName">
        الطالب
      </span>

      <button
        class="logout-btn"
        onclick="logout()">

        تسجيل الخروج

      </button>

    </div>

  </header>


  <!-- MAIN -->

  <main class="student-container">


    <!-- WELCOME -->

    <section class="welcome-box">

      <h1 id="welcomeTitle">
        أهلاً بك 👋
      </h1>

      <p>
        تابع دروسك وتقدمك التعليمي من مكان واحد.
      </p>

    </section>


    <!-- STATS -->

    <section class="stats">

      <div class="stat">

        <div class="stat-icon">
          📚
        </div>

        <div>

          <span>
            الدروس المتاحة
          </span>

          <strong id="totalLessons">
            0
          </strong>

        </div>

      </div>


      <div class="stat">

        <div class="stat-icon">
          ✅
        </div>

        <div>

          <span>
            الدروس المكتملة
          </span>

          <strong id="completedLessons">
            0
          </strong>

        </div>

      </div>


      <div class="stat">

        <div class="stat-icon">
          📈
        </div>

        <div>

          <span>
            نسبة الإنجاز
          </span>

          <strong id="completionPercent">
            0%
          </strong>

        </div>

      </div>

    </section>


    <!-- LESSONS -->

    <section>

      <div class="section-header">

        <h2>
          دروسك
        </h2>

        <span id="lessonCount">
          جاري التحميل...
        </span>

      </div>


      <div
        id="lessonsGrid"
        class="lessons-grid">

        <div class="state-box">
          جاري تحميل الدروس...
        </div>

      </div>

    </section>


  </main>


  <footer>

    لغتي لغة الضاد © 2026
    <br>
    تم التصميم والتطوير بواسطة Mohamed Hussain — M11

  </footer>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>


  <script>

    let currentStudent = null;


    /* =========================
       AUTH
    ========================== */

    async function protectStudentPage(){

      const user = await getCurrentUser();

      if(!user){

        window.location.href =
          "login.html";

        return false;
      }


      const profile =
        await getMyProfile();


      if(!profile ||
         profile.role !== "student"){

        await supabaseClient.auth.signOut();

        window.location.href =
          "login.html";

        return false;
      }


      currentStudent = profile;


      const name =
        profile.full_name ||
        profile.username ||
        "الطالب";


      document.getElementById(
        "studentName"
      ).textContent = name;


      document.getElementById(
        "welcomeTitle"
      ).textContent =
        "أهلاً بك، " + name + " 👋";


      return true;

    }


    /* =========================
       LOAD DATA
    ========================== */

    async function loadStudentDashboard(){

      const grid =
        document.getElementById(
          "lessonsGrid"
        );


      try{

        const lessons =
          await getLessons();


        const progress =
          await getMyProgress();


        const publishedLessons =
          lessons.filter(
            lesson =>
              lesson.is_published === true
          );


        const progressMap = {};


        progress.forEach(item => {

          progressMap[item.lesson_id] =
            item;

        });


        const completed =
          publishedLessons.filter(
            lesson =>
              progressMap[lesson.id] &&
              progressMap[lesson.id].completed
          ).length;


        const total =
          publishedLessons.length;


        const percent =
          total > 0
            ? Math.round(
                (completed / total) * 100
              )
            : 0;


        document.getElementById(
          "totalLessons"
        ).textContent = total;


        document.getElementById(
          "completedLessons"
        ).textContent = completed;


        document.getElementById(
          "completionPercent"
        ).textContent =
          percent + "%";


        document.getElementById(
          "lessonCount"
        ).textContent =
          total + " درس";


        if(total === 0){

          grid.innerHTML = `

            <div class="state-box">

              لا توجد دروس منشورة حاليًا.

            </div>

          `;

          return;

        }


        grid.innerHTML =
          publishedLessons.map(
            lesson => {

              const item =
                progressMap[lesson.id];


              const lessonProgress =
                item
                  ? Math.max(
                      0,
                      Math.min(
                        100,
                        Number(item.progress) || 0
                      )
                    )
                  : 0;


              const isCompleted =
                item &&
                item.completed;


              return `

                <article class="lesson-card">


                  <div class="lesson-top">

                    <div class="lesson-icon">
                      📖
                    </div>

                    <span class="lesson-grade">
                      ${escapeHtml(
                        lesson.grade || "عام"
                      )}
                    </span>

                  </div>


                  <div class="lesson-body">

                    <div class="subject">
                      ${escapeHtml(
                        lesson.subject || "اللغة العربية"
                      )}
                    </div>


                    <h3>
                      ${escapeHtml(
                        lesson.title || "درس"
                      )}
                    </h3>


                    <div class="description">

                      ${escapeHtml(
                        lesson.description ||
                        "ابدأ دراسة هذا الدرس الآن."
                      )}

                    </div>


                    <div class="progress-area">

                      <div class="progress-label">

                        <span>
                          التقدم
                        </span>

                        <span class="${
                          isCompleted
                            ? "completed"
                            : ""
                        }">

                          ${
                            isCompleted
                              ? "مكتمل ✓"
                              : lessonProgress + "%"
                          }

                        </span>

                      </div>


                      <div class="progress">

                        <div
                          class="progress-fill"
                          style="width:${lessonProgress}%">
                        </div>

                      </div>

                    </div>


                    <a
                      class="open-lesson"
                      href="lesson.html?id=${encodeURIComponent(
                        lesson.id
                      )}">

                      ${
                        isCompleted
                          ? "مراجعة الدرس"
                          : "ابدأ الدرس"
                      }

                    </a>

                  </div>

                </article>

              `;

            }
          ).join("");


      }catch(error){

        console.error(error);


        grid.innerHTML = `

          <div class="state-box">

            حدث خطأ أثناء تحميل الدروس.
            <br>
            حاول تحديث الصفحة.

          </div>

        `;

      }

    }


    /* =========================
       START
    ========================== */

    (async function(){

      const allowed =
        await protectStudentPage();


      if(!allowed) return;


      await loadStudentDashboard();

    })();

  </script>

</body>

  </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الدرس | لغتي لغة الضاد</title>

  <link rel="stylesheet" href="style-new.css">

  <style>
    .lesson-page{
      max-width:1000px;
      margin:40px auto;
      padding:20px;
    }

    .lesson-card{
      background:#fff;
      border-radius:30px;
      padding:40px;
      box-shadow:0 20px 60px rgba(0,0,0,.08);
      animation:lessonShow .7s ease;
    }

    @keyframes lessonShow{
      from{
        opacity:0;
        transform:translateY(25px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .lesson-badge{
      display:inline-block;
      background:#eff6ff;
      color:#1e40af;
      padding:8px 16px;
      border-radius:50px;
      margin-bottom:15px;
      font-weight:bold;
    }

    .lesson-title{
      font-size:42px;
      color:#1e40af;
      margin-bottom:15px;
    }

    .lesson-description{
      color:#64748b;
      font-size:19px;
      line-height:2;
      margin-bottom:30px;
    }

    .lesson-content{
      font-size:20px;
      line-height:2.2;
      white-space:pre-wrap;
      color:#1e293b;
    }

    .video-box{
      margin:30px 0;
      position:relative;
      padding-bottom:56.25%;
      height:0;
      overflow:hidden;
      border-radius:22px;
    }

    .video-box iframe{
      position:absolute;
      width:100%;
      height:100%;
      border:0;
      right:0;
      top:0;
    }

    .pdf-btn{
      display:inline-block;
      background:#dc2626;
      color:#fff;
      padding:14px 25px;
      border-radius:15px;
      text-decoration:none;
      margin:20px 0;
    }

    .progress-section{
      margin-top:40px;
      background:#f8fafc;
      padding:25px;
      border-radius:22px;
    }

    .progress-track{
      height:15px;
      background:#e2e8f0;
      border-radius:20px;
      overflow:hidden;
      margin:15px 0;
    }

    .progress-fill{
      height:100%;
      width:0%;
      background:#1e40af;
      transition:1s;
    }

    .complete-btn{
      border:0;
      background:#1e40af;
      color:white;
      padding:15px 30px;
      border-radius:15px;
      font-size:18px;
      cursor:pointer;
    }

    .complete-btn:hover{
      background:#d4a017;
    }

    /* QUIZ */

    .quiz-section{
      margin-top:45px;
      background:linear-gradient(135deg,#eff6ff,#ffffff);
      padding:35px;
      border-radius:30px;
      border:1px solid #dbeafe;
    }

    .quiz-header h2{
      color:#1e40af;
      font-size:30px;
      margin-bottom:10px;
    }

    .quiz-header p{
      color:#64748b;
      line-height:1.8;
    }

    .question-card{
      background:white;
      padding:25px;
      border-radius:22px;
      margin-top:25px;
      box-shadow:0 8px 25px rgba(0,0,0,.05);
    }

    .question-title{
      font-size:20px;
      font-weight:bold;
      margin-bottom:20px;
    }

    .option{
      display:block;
      padding:14px;
      margin:10px 0;
      border:2px solid #e2e8f0;
      border-radius:15px;
      cursor:pointer;
      transition:.2s;
    }

    .option:hover{
      border-color:#1e40af;
      background:#eff6ff;
    }

    .option input{
      margin-left:10px;
    }

    .quiz-submit{
      margin-top:25px;
      border:0;
      background:#1e40af;
      color:#fff;
      padding:16px 35px;
      border-radius:16px;
      font-size:18px;
      cursor:pointer;
    }

    .quiz-result{
      margin-top:25px;
      padding:25px;
      border-radius:20px;
      display:none;
      text-align:center;
      font-size:22px;
      font-weight:bold;
    }

    .quiz-success{
      background:#dcfce7;
      color:#166534;
    }

    .quiz-fail{
      background:#fee2e2;
      color:#991b1b;
    }

    .loading{
      text-align:center;
      padding:60px;
      font-size:22px;
    }

    @media(max-width:700px){
      .lesson-card{
        padding:25px;
      }

      .lesson-title{
        font-size:30px;
      }

      .lesson-content{
        font-size:18px;
      }
    }
  </style>
</head>

<body>

<header class="navbar">

  <div class="brand">
    <img src="logo.svg" alt="لغتي لغة الضاد">
    <span>لغتي لغة الضاد</span>
  </div>

  <nav class="nav-links">
    <a href="student.html">الرئيسية</a>
    <a href="profile.html">حسابي</a>
    <a href="support.html">الدعم</a>
  </nav>

</header>


<main class="lesson-page">

  <div id="loading" class="loading">
    ⏳ جاري تحميل الدرس...
  </div>


  <section id="lessonContainer"
           class="lesson-card"
           style="display:none;">

    <div id="lessonBadge"
         class="lesson-badge"></div>

    <h1 id="lessonTitle"
        class="lesson-title"></h1>

    <p id="lessonDescription"
       class="lesson-description"></p>

    <div id="videoContainer"></div>

    <div id="lessonContent"
         class="lesson-content"></div>

    <div id="pdfContainer"></div>


    <div class="progress-section">

      <h3>📊 تقدمك في هذا الدرس</h3>

      <div class="progress-track">
        <div id="progressFill"
             class="progress-fill"></div>
      </div>

      <p id="progressText">0%</p>

      <br>

      <button
        id="completeButton"
        class="complete-btn">
        ✅ إتمام الدرس
      </button>

    </div>


    <!-- QUIZ -->

    <section id="quizSection"
             class="quiz-section"
             style="display:none;">

      <div class="quiz-header">

        <h2 id="quizTitle">
          📝 اختبار الدرس
        </h2>

        <p id="quizDescription"></p>

      </div>

      <div id="questionsContainer"></div>

      <button
        id="quizSubmit"
        class="quiz-submit">
        🎯 تصحيح الاختبار
      </button>

      <div id="quizResult"
           class="quiz-result">
      </div>

    </section>

  </section>

</main>


<footer>
  <p>© 2026 لغتي لغة الضاد</p>
  <p>تصميم وتطوير Mohamed Hussain — M11</p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

<script>

const params = new URLSearchParams(
  window.location.search
);

const lessonId = params.get("id");

let currentLesson = null;
let currentQuiz = null;


function youtubeEmbed(url){

  if(!url) return "";

  try{

    const parsed = new URL(url);

    let videoId = "";

    if(parsed.hostname.includes("youtu.be")){
      videoId = parsed.pathname.substring(1);
    }

    if(parsed.hostname.includes("youtube.com")){
      videoId = parsed.searchParams.get("v") || "";

      if(parsed.pathname.includes("/embed/")){
        videoId =
          parsed.pathname.split("/embed/")[1];
      }
    }

    if(!videoId) return "";

    return `
      <div class="video-box">
        <iframe
          src="https://www.youtube.com/embed/${videoId}"
          allowfullscreen>
        </iframe>
      </div>
    `;

  }catch{
    return "";
  }
}


async function loadLesson(){

  if(!lessonId){
    document.getElementById("loading").textContent =
      "لم يتم تحديد الدرس.";
    return;
  }

  const user = await getCurrentUser();

  if(!user){
    window.location.href = "login.html";
    return;
  }

  const profile = await getMyProfile();

  if(!profile || profile.role !== "student"){
    window.location.href = "login.html";
    return;
  }


  currentLesson = await getLesson(lessonId);

  if(!currentLesson){
    document.getElementById("loading").textContent =
      "لم يتم العثور على هذا الدرس.";
    return;
  }


  document.title =
    currentLesson.title + " | لغتي لغة الضاد";


  document.getElementById("lessonBadge").textContent =
    `${currentLesson.grade} • ${currentLesson.subject}`;

  document.getElementById("lessonTitle").textContent =
    currentLesson.title;

  document.getElementById("lessonDescription").textContent =
    currentLesson.description || "";


  document.getElementById("lessonContent").textContent =
    currentLesson.content || "لا يوجد محتوى نصي لهذا الدرس.";


  if(currentLesson.video_url){

    document.getElementById("videoContainer").innerHTML =
      youtubeEmbed(currentLesson.video_url);

  }


  if(currentLesson.pdf_url){

    document.getElementById("pdfContainer").innerHTML = `
      <a
        class="pdf-btn"
        href="${currentLesson.pdf_url}"
        target="_blank"
        rel="noopener">
        📄 فتح ملف الدرس PDF
      </a>
    `;

  }


  const progressList = await getMyProgress();

  const progress = progressList.find(
    item => item.lesson_id === lessonId
  );

  const currentProgress =
    progress ? progress.progress : 0;

  updateProgress(currentProgress);


  if(!progress){

    await saveLessonProgress(
      lessonId,
      10,
      false
    );

    updateProgress(10);

  }


  await loadQuiz();


  document.getElementById("loading").style.display =
    "none";

  document.getElementById("lessonContainer").style.display =
    "block";
}


function updateProgress(value){

  value = Math.max(
    0,
    Math.min(100, value)
  );

  document.getElementById("progressFill")
    .style.width = value + "%";

  document.getElementById("progressText")
    .textContent = value + "%";
}


document.getElementById("completeButton")
  .addEventListener("click", async function(){

    this.disabled = true;
    this.textContent = "⏳ جاري الحفظ...";

    const success = await saveLessonProgress(
      lessonId,
      100,
      true
    );

    if(success){

      updateProgress(100);

      this.textContent =
        "🎉 تم إتمام الدرس";

    }else{

      this.disabled = false;
      this.textContent =
        "❌ حاول مرة أخرى";

    }

  });


async function loadQuiz(){

  currentQuiz = await getQuizByLesson(lessonId);

  if(!currentQuiz) return;

  if(
    !currentQuiz.quiz_questions ||
    currentQuiz.quiz_questions.length === 0
  ){
    return;
  }


  document.getElementById("quizSection")
    .style.display = "block";

  document.getElementById("quizTitle")
    .textContent =
      "📝 " + currentQuiz.title;

  document.getElementById("quizDescription")
    .textContent =
      currentQuiz.description || "";


  const container =
    document.getElementById("questionsContainer");

  container.innerHTML = "";


  currentQuiz.quiz_questions.forEach(
    (question, index) => {

      const card =
        document.createElement("div");

      card.className = "question-card";

      card.innerHTML = `

        <div class="question-title">
          ${index + 1}. ${escapeHTML(question.question)}
        </div>

        ${createOption(
          question.id,
          "a",
          question.option_a
        )}

        ${createOption(
          question.id,
          "b",
          question.option_b
        )}

        ${createOption(
          question.id,
          "c",
          question.option_c
        )}

        ${createOption(
          question.id,
          "d",
          question.option_d
        )}

      `;

      container.appendChild(card);

    }
  );

}


function createOption(
  questionId,
  letter,
  text
){

  return `
    <label class="option">

      <input
        type="radio"
        name="question-${questionId}"
        value="${letter}">

      ${escapeHTML(text)}

    </label>
  `;

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


document.getElementById("quizSubmit")
  .addEventListener("click", async function(){

    if(!currentQuiz) return;

    const questions =
      currentQuiz.quiz_questions || [];

    let score = 0;
    let totalPoints = 0;
    let answered = 0;


    questions.forEach(question => {

      totalPoints +=
        Number(question.points || 1);

      const selected =
        document.querySelector(
          `input[name="question-${question.id}"]:checked`
        );

      if(selected){

        answered++;

        if(
          selected.value ===
          question.correct_answer
        ){

          score +=
            Number(question.points || 1);

        }

      }

    });


    if(answered < questions.length){

      alert(
        `من فضلك أجب عن جميع الأسئلة.\nأجبت عن ${answered} من ${questions.length}.`
      );

      return;
    }


    this.disabled = true;
    this.textContent =
      "⏳ جاري حفظ النتيجة...";


    try{

      const result =
        await saveQuizAttempt(
          currentQuiz.id,
          score,
          totalPoints
        );


      const percentage =
        result.percentage;


      const resultBox =
        document.getElementById("quizResult");

      resultBox.style.display = "block";

      if(percentage >= 50){

        resultBox.className =
          "quiz-result quiz-success";

        resultBox.innerHTML = `
          🎉 ممتاز!
          <br>
          حصلت على
          ${score} من ${totalPoints}
          <br>
          النتيجة: ${percentage}%
        `;

        await saveLessonProgress(
          lessonId,
          100,
          true
        );

        updateProgress(100);

        document.getElementById(
          "completeButton"
        ).textContent =
          "🎉 تم إتمام الدرس والاختبار";

      }else{

        resultBox.className =
          "quiz-result quiz-fail";

        resultBox.innerHTML = `
          💪 حاول مرة أخرى
          <br>
          حصلت على
          ${score} من ${totalPoints}
          <br>
          النتيجة: ${percentage}%
        `;

      }


      this.textContent =
        "✅ تم تصحيح الاختبار";

    }catch(error){

      console.error(error);

      alert(
        error.message ||
        "حدث خطأ أثناء حفظ النتيجة."
      );

      this.disabled = false;

      this.textContent =
        "🎯 تصحيح الاختبار";

    }

  });


loadLesson();

</script>

</body>
</html>

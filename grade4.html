<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الصف الرابع الابتدائي | لغتي لغة الضاد</title>

  <link rel="stylesheet" href="style-new.css">

  <style>

    body{
      background:#f8fafc;
      font-family:Tahoma,Arial,sans-serif;
      color:#0f172a;
    }

    .grade-header{
      background:#fff;
      border-bottom:1px solid #e2e8f0;
      padding:14px 5%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      position:sticky;
      top:0;
      z-index:100;
      box-shadow:0 5px 20px rgba(15,23,42,.05);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand img{
      width:48px;
      height:48px;
    }

    .brand strong{
      display:block;
      color:#1e40af;
      font-size:18px;
    }

    .brand span{
      display:block;
      color:#64748b;
      font-size:11px;
      margin-top:3px;
    }

    .back{
      text-decoration:none;
      background:#eff6ff;
      color:#1e40af;
      padding:10px 14px;
      border-radius:12px;
      font-size:13px;
      font-weight:bold;
    }

    .container{
      width:min(1100px,94%);
      margin:32px auto 70px;
    }

    .hero{
      background:linear-gradient(135deg,#1e40af,#2563eb);
      color:#fff;
      border-radius:25px;
      padding:32px;
      margin-bottom:25px;
      box-shadow:0 18px 45px rgba(30,64,175,.18);
    }

    .hero h1{
      margin:0 0 10px;
      font-size:31px;
    }

    .hero p{
      margin:0;
      color:#dbeafe;
      line-height:1.9;
      font-size:14px;
    }

    .courses-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:18px;
    }

    .courses-title h2{
      margin:0;
      font-size:21px;
    }

    .courses-title span{
      color:#64748b;
      font-size:12px;
    }

    .lessons{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:18px;
    }

    .lesson{
      background:#fff;
      border:1px solid #e2e8f0;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 12px 35px rgba(15,23,42,.07);
      transition:.25s;
    }

    .lesson:hover{
      transform:translateY(-5px);
      box-shadow:0 18px 42px rgba(15,23,42,.11);
    }

    .lesson-top{
      padding:22px;
      background:#eff6ff;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .lesson-icon{
      width:48px;
      height:48px;
      border-radius:14px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:23px;
    }

    .subject{
      background:#fff;
      color:#1e40af;
      padding:7px 10px;
      border-radius:999px;
      font-size:10px;
      font-weight:bold;
    }

    .lesson-body{
      padding:20px;
    }

    .lesson-body h3{
      margin:0 0 9px;
      font-size:17px;
      line-height:1.6;
    }

    .lesson-body p{
      margin:0;
      color:#64748b;
      font-size:12px;
      line-height:1.9;
      min-height:45px;
    }

    .open{
      display:block;
      text-align:center;
      text-decoration:none;
      background:#1e40af;
      color:#fff;
      padding:12px;
      border-radius:12px;
      margin-top:16px;
      font-size:13px;
      font-weight:bold;
    }

    .empty{
      background:#fff;
      border:1px solid #e2e8f0;
      border-radius:20px;
      padding:50px 20px;
      text-align:center;
      color:#64748b;
    }

    footer{
      text-align:center;
      color:#94a3b8;
      font-size:12px;
      padding:25px;
    }

    @media(max-width:600px){

      .grade-header{
        padding:12px 15px;
      }

      .brand img{
        width:42px;
        height:42px;
      }

      .brand strong{
        font-size:14px;
      }

      .brand span{
        font-size:9px;
      }

      .back{
        font-size:11px;
        padding:9px 11px;
      }

      .hero{
        padding:24px 20px;
      }

      .hero h1{
        font-size:24px;
      }

      .lessons{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>

<body>

  <header class="grade-header">

    <div class="brand">

      <img src="logo.svg" alt="لغتي لغة الضاد">

      <div>
        <strong>لغتي لغة الضاد</strong>
        <span>المنصة التعليمية</span>
      </div>

    </div>

    <a href="student.html" class="back">
      ← لوحة الطالب
    </a>

  </header>


  <main class="container">

    <section class="hero">

      <h1>
        الصف الرابع الابتدائي
      </h1>

      <p>
        جميع الدروس التعليمية المتاحة لهذا الصف.
      </p>

    </section>


    <div class="courses-title">

      <h2>
        دروس الصف
      </h2>

      <span id="lessonCount">
        جاري التحميل...
      </span>

    </div>


    <section
      id="lessons"
      class="lessons">

      <div class="empty">
        جاري تحميل الدروس...
      </div>

    </section>

  </main>


  <footer>

    لغتي لغة الضاد © 2026
    <br>
    تم التصميم والتطوير بواسطة Mohamed Hussain — M11

  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>


  <script>

    const GRADE =
      "الصف الرابع الابتدائي";


    function escapeHtml(value){

      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

    }


    async function loadGradeLessons(){

      const container =
        document.getElementById("lessons");


      try{

        const lessons =
          await getLessons();


        const gradeLessons =
          lessons.filter(
            lesson =>
              lesson.is_published === true &&
              lesson.grade === GRADE
          );


        document.getElementById(
          "lessonCount"
        ).textContent =
          gradeLessons.length + " درس";


        if(gradeLessons.length === 0){

          container.innerHTML = `

            <div class="empty">

              لا توجد دروس منشورة لهذا الصف حاليًا.

            </div>

          `;

          return;

        }


        container.innerHTML =
          gradeLessons.map(
            lesson => `

              <article class="lesson">

                <div class="lesson-top">

                  <div class="lesson-icon">
                    📖
                  </div>

                  <span class="subject">
                    ${escapeHtml(
                      lesson.subject ||
                      "اللغة العربية"
                    )}
                  </span>

                </div>


                <div class="lesson-body">

                  <h3>
                    ${escapeHtml(
                      lesson.title ||
                      "درس"
                    )}
                  </h3>


                  <p>
                    ${escapeHtml(
                      lesson.description ||
                      "ابدأ دراسة هذا الدرس."
                    )}
                  </p>


                  <a
                    class="open"
                    href="lesson.html?id=${encodeURIComponent(
                      lesson.id
                    )}">

                    دخول إلى الدرس

                  </a>

                </div>

              </article>

            `
          ).join("");

      }catch(error){

        console.error(error);

        container.innerHTML = `

          <div class="empty">

            حدث خطأ أثناء تحميل الدروس.

          </div>

        `;

      }

    }


    (async function(){

      const user =
        await getCurrentUser();


      if(!user){

        window.location.href =
          "login.html";

        return;

      }


      const profile =
        await getMyProfile();


      if(
        !profile ||
        profile.role !== "student"
      ){

        await supabaseClient.auth.signOut();

        window.location.href =
          "login.html";

        return;

      }


      await loadGradeLessons();

    })();

  </script>

</body>

</html>

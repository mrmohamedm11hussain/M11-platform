<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة تحكم المدرس</title>


<style>

body{
margin:0;
font-family:Tahoma,Arial;
background:#f1f5f9;
}


header{

background:#2563eb;
color:white;
padding:20px;
font-size:25px;
font-weight:bold;

}


.container{

width:90%;
max-width:600px;
margin:40px auto;

background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px #ddd;

}


h1{

color:#1e40af;
text-align:center;

}


input,textarea{

width:100%;
padding:15px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;

}


textarea{

height:120px;

}


button{

width:100%;
background:#2563eb;
color:white;
padding:15px;
border:0;
border-radius:10px;
font-size:18px;
cursor:pointer;

}


button:hover{

background:#1d4ed8;

}


a{

display:block;
text-align:center;
margin-top:20px;
color:#2563eb;

}


</style>

</head>


<body>


<header>
M11 Platform - لوحة المدرس
</header>



<div class="container">


<h1>
إضافة درس جديد
</h1>


<input placeholder="اسم المادة">


<input placeholder="عنوان الدرس">


<input placeholder="رابط الفيديو">


<textarea placeholder="وصف الدرس"></textarea>


<button>
نشر الدرس
</button>


<a href="index.html">
العودة للرئيسية
</a>


</div>



</body>

</html>

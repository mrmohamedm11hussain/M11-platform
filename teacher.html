<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>لوحة المعلمة | لغتي لغة الضاد</title>

<link rel="stylesheet" href="style.css">


<style>

.dashboard{

width:90%;
max-width:1100px;
margin:40px auto;

}


.dashboard-header{

background:linear-gradient(135deg,#0f172a,#1e40af);
color:white;
padding:40px;
border-radius:30px;

}


.dashboard-header h1{

font-size:38px;

}


.teacher-name{

color:#facc15;

}



/* الاحصائيات */

.stats{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:30px;

}


.stat{

background:white;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 25px #ddd;

}


.stat h2{

color:#1e40af;
font-size:35px;

}



/* لوحة الاضافة */

.panel{

background:white;
margin-top:30px;
padding:35px;
border-radius:25px;
box-shadow:0 10px 30px #ddd;

}


.panel h2{

color:#1e40af;

}



input,select,textarea{

width:100%;
padding:15px;
margin:10px 0;
border:1px solid #ddd;
border-radius:12px;

}


textarea{

height:120px;

}


.add-btn{

width:100%;
background:#1e40af;

}



</style>

</head>

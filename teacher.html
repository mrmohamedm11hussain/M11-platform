<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة المعلمة - لغتي لغة الضاد</title>

<link rel="stylesheet" href="style.css">


<style>

.dashboard{

max-width:700px;
margin:40px auto;
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 10px 30px #ddd;

}


.dashboard h1{

text-align:center;
color:#1e40af;
margin-bottom:10px;

}


.teacher{

text-align:center;
color:#b8860b;
font-size:20px;
margin-bottom:30px;

}


input,textarea,select{

width:100%;
padding:15px;
margin:10px 0;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;

}


textarea{

height:120px;

}


.add{

width:100%;
background:#1e40af;
color:white;
padding:15px;
border:0;
border-radius:12px;
font-size:18px;

}


.boxes{

display:flex;
gap:15px;
flex-wrap:wrap;
margin-top:30px;

}


.box{

flex:1;
min-width:180px;
background:#f8fafc;
padding:20px;
border-radius:15px;
text-align:center;

}


</style>

</head>


<body>


<header>

<div class="logo">
📚 لغتي لغة الضاد
</div>


</header>



<div class="dashboard">


<h1>
لوحة تحكم المعلمة
</h1>


<div class="teacher">
👩‍🏫 المعلمة سمر رمضان
</div>



<select>

<option>
اختر القسم
</option>

<option>
النحو
</option>

<option>
القراءة
</option>

<option>
الكتابة والتعبير
</option>

<option>
البلاغة
</option>

</select>



<input placeholder="عنوان الدرس">


<input placeholder="رابط الفيديو">



<textarea placeholder="وصف الدرس"></textarea>



<button class="add">
نشر الدرس
</button>



<div class="boxes">


<div class="box">

<h3>
📚 الدروس
</h3>

<p>
إدارة الدروس
</p>

</div>


<div class="box">

<h3>
🎥 الفيديوهات
</h3>

<p>
إضافة الشروحات
</p>

</div>


<div class="box">

<h3>
📄 الملفات
</h3>

<p>
رفع المذكرات
</p>

</div>


</div>


</div>


<footer>

لغتي لغة الضاد © 2026
<br>
تصميم وتطوير M11

</footer>


</body>

</html>

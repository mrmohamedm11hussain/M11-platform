<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة تحكم المعلمة | لغتي لغة الضاد</title>

  <link rel="stylesheet" href="style-new.css">

  <style>
    body{
      background:#f6f9fc;
      color:#10233f;
    }

    .teacher-page{
      width:92%;
      max-width:1250px;
      margin:35px auto;
    }

    .top-dashboard{
      background:linear-gradient(135deg,#1e40af,#2563eb);
      color:white;
      border-radius:30px;
      padding:35px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:25px;
      box-shadow:0 20px 45px rgba(30,64,175,.22);
      margin-bottom:30px;
    }

    .top-dashboard h1{
      font-size:34px;
      margin-bottom:10px;
    }

    .top-dashboard p{
      opacity:.9;
      font-size:17px;
      line-height:1.8;
    }

    .teacher-logo{
      width:90px;
      height:90px;
      background:white;
      border-radius:25px;
      padding:10px;
      object-fit:contain;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
      margin-bottom:30px;
    }

    .stat-card{
      background:white;
      border-radius:25px;
      padding:25px;
      box-shadow:0 12px 30px rgba(15,23,42,.08);
      text-align:center;
    }

    .stat-icon{
      font-size:35px;
      margin-bottom:8px;
    }

    .stat-card h3{
      color:#64748b;
      font-size:16px;
      margin-bottom:8px;
    }

    .stat-number{
      font-size:34px;
      font-weight:bold;
      color:#1e40af;
    }

    .dashboard-grid{
      display:grid;
      grid-template-columns:380px 1fr;
      gap:25px;
      align-items:start;
    }

    .panel{
      background:white;
      border-radius:28px;
      padding:28px;
      box-shadow:0 12px 35px rgba(15,23,42,.08);
    }

    .panel h2{
      margin-bottom:22px;
      color:#1e40af;
      font-size:24px;
    }

    .form-group{
      margin-bottom:17px;
    }

    .form-group label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#334155;
    }

    .form-group input,
    .form-group select,
    .form-group textarea{
      width:100%;
      border:1px solid #dbe4ef;
      border-radius:14px;
      padding:13px;
      font-size:15px;
      outline:none;
      background:#f8fafc;
      transition:.2s;
    }

    .form-group textarea{
      min-height:110px;
      resize:vertical;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus{
      border-color:#2563eb;
      background:white;
      box-shadow:0 0 0 3px rgba(37,99,235,.08);
    }

    .publish-row{
      display:flex;
      align-items:center;
      gap:10px;
      background:#f8fafc;
      padding:13px;
      border-radius:14px;
      margin-bottom:18px;
    }

    .publish-row input{
      width:20px;
      height:20px;
    }

    .save-btn{
      width:100%;
      border:0;
      background:#1e40af;
      color:white;
      padding:15px;
      border-radius:15px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:.3s;
    }

    .save-btn:hover{
      background:#d4a017;
      transform:translateY(-2px);
    }

    .logout-btn{
      display:inline-block;
      margin-top:15px;
      background:#fee2e2;
      color:#b91c1c;
      padding:11px 18px;
      border-radius:12px;
      text-decoration:none;
      font-weight:bold;
    }

    .lesson-list{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .lesson-item{
      border:1px solid #e2e8f0;
      border-radius:20px;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      background:#fbfdff;
    }

    .lesson-info h3{
      color:#1e3a8a;
      margin-bottom:7px;
    }

    .lesson-meta{
      color:#64748b;
      font-size:14px;
      line-height:1.8;
    }

    .badge{
      display:inline-block;
      padding:5px 10px;
      border-radius:20px;
      font-size:12px;
      font-weight:bold;
      margin-top:7px;
    }

    .published{
      background:#dcfce7;
      color:#15803d;
    }

    .draft{
      background:#fef3c7;
      color:#a16207;
    }

    .delete-btn{
      border:0;
      background:#fee2e2;
      color:#dc2626;
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
      white-space:nowrap;
    }

    .empty{
      text-align:center;
      color:#64748b;
      padding:45px 15px;
    }

      padding:12px;

      margin

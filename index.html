<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصتي التعليمية</title>

<style>
*{
    box-sizing:border-box;
    font-family:Tahoma, Arial;
}

body{
    margin:0;
    background:#f5f7fb;
    color:#222;
}

header{
    background:#2563eb;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

button{
    background:white;
    color:#2563eb;
    border:0;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

.hero{
    padding:60px 20px;
    text-align:center;
}

.hero h1{
    font-size:40px;
    color:#1e3a8a;
}

.hero p{
    font-size:20px;
}

.cards{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
    padding:30px;
}

.card{
    background:white;
    width:280px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px #ddd;
}

.card h2{
    color:#2563eb;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>

</head>

<body>

<header>

<div class="logo">
منصتي
</div>

<button>
تسجيل الدخول
</button>

</header>


<section class="hero">

<h1>
مرحبا بك في منصتك التعليمية
</h1>

<p>
تعلم بسهولة، شاهد الدروس، وتابع تقدمك في مكان واحد
</p>

<button>
ابدأ التعلم
</button>

</section>



<section class="cards">

<div class="card">
<h2>الدروس</h2>
<p>
شاهد جميع الدروس التعليمية بطريقة منظمة.
</p>
</div>


<div class="card">
<h2>الطلاب</h2>
<p>
نظام متابعة للطلاب والواجبات.
</p>
</div>


<div class="card">
<h2>المعلم</h2>
<p>
إضافة المحتوى وإدارة المنصة بسهولة.
</p>
</div>


</section>


<footer>

تم التصميم والتطوير 2026

</footer>


</body>
</html>

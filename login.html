<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تسجيل الدخول | لغتي لغة الضاد</title>

  <link rel="stylesheet" href="style-new.css">

  <style>

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:25px;
      background:
        radial-gradient(circle at top right,#dbeafe,transparent 35%),
        radial-gradient(circle at bottom left,#fef3c7,transparent 35%),
        #f8fafc;
    }

    .login-wrapper{
      width:100%;
      max-width:460px;
    }

    .login-card{
      background:white;
      border-radius:32px;
      padding:40px;
      box-shadow:0 25px 70px rgba(15,23,42,.14);
    }

    .brand{
      text-align:center;
      margin-bottom:30px;
    }

    .brand img{
      width:90px;
      height:90px;
      margin-bottom:12px;
    }

    .brand h1{
      color:#1e40af;
      font-size:30px;
      margin-bottom:8px;
    }

    .brand p{
      color:#64748b;
      line-height:1.8;
    }

    .form-group{
      margin-bottom:18px;
    }

    .form-group label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#334155;
    }

    .form-group input,
    .form-group select{
      width:100%;
      padding:15px;
      border:1px solid #dbe4ef;
      border-radius:15px;
      background:#f8fafc;
      outline:none;
      font-size:16px;
      transition:.2s;
    }

    .form-group input:focus,
    .form-group select:focus{
      background:white;
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,.08);
    }

    .password-box{
      position:relative;
    }

    .password-box button{
      position:absolute;
      left:10px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      cursor:pointer;
      font-size:18px;
    }

    .login-btn{
      width:100%;
      border:0;
      background:#1e40af;
      color:white;
      padding:16px;
      border-radius:15px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:.3s;
      margin-top:5px;
    }

    .login-btn:hover{
      background:#d4a017;
      transform:translateY(-2px);
    }

    .login-btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .message{
      display:none;
      padding:13px;
      border-radius:13px;
      margin-bottom:16px;
      text-align:center;
      line-height:1.7;
      font-weight:bold;
    }

    .back{
      display:block;
      text-align:center;
      margin-top:22px;
      color:#64748b;
      text-decoration:none;
    }

    .back:hover{
      color:#1e40af;
    }

    .teacher-note{
      display:none;
      background:#eff6ff;
      color:#1e40af;
      padding:12px;
      border-radius:13px;
      margin-bottom:17px;
      font-size:14px;
      line-height:1.7;
    }

    @media(max-width:500px){

      .login-card{
        padding:28px 22px;
      }

      .brand h1{
        font-size:25px;
      }

    }

  </style>

</head>


<body>

<div class="login-wrapper">

  <div class="login-card">

    <div class="brand">

      <img
        src="logo.svg"
        alt="لغتي لغة الضاد"
      >

      <h1>لغتي لغة الضاد</h1>

      <p>
        مرحبًا بك في منصتك التعليمية 🌷
      </p>

    </div>


    <div
      id="loginMessage"
      class="message"
    ></div>


    <form id="loginForm">


      <div class="form-group">

        <label>
          نوع الحساب
        </label>

        <select id="userType">

          <option value="student">
            👨‍🎓 طالب
          </option>

          <option value="teacher">
            👩‍🏫 معلمة
          </option>

        </select>

      </div>


      <div
        id="teacherNote"
        class="teacher-note"
      >
        تسجيل المعلمة يتم باستخدام اسم المستخدم
        <strong>samar</strong>.
      </div>


      <div class="form-group">

        <label id="usernameLabel">
          البريد الإلكتروني
        </label>

        <input
          type="text"
          id="username"
          placeholder="أدخل بريدك الإلكتروني"
          autocomplete="username"
          required
        >

      </div>


      <div class="form-group">

        <label>
          كلمة المرور
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            onclick="togglePassword()"
            aria-label="إظهار كلمة المرور"
          >
            👁️
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginButton"
      >
        تسجيل الدخول
      </button>

    </form>


    <a
      href="index.html"
      class="back"
    >
      ← العودة إلى الرئيسية
    </a>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

<script src="login-system.js"></script>


</body>

</html>

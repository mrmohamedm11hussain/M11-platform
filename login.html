<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول | لغتي لغة الضاد</title>

<link rel="stylesheet" href="style-new.css">

<style>

.login-page{

min-height:calc(100vh - 80px);

display:flex;

align-items:center;

justify-content:center;

padding:40px 20px;

}

.login-box{

width:100%;

max-width:480px;

background:white;

padding:45px;

border-radius:35px;

box-shadow:0 20px 60px rgba(0,0,0,.10);

text-align:center;

animation:loginShow .7s ease;

}

@keyframes loginShow{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.login-logo{

width:95px;

margin-bottom:15px;

}

.login-box h1{

font-size:36px;

color:#1e40af;

margin-bottom:10px;

}

.login-box .subtitle{

color:#64748b;

line-height:1.8;

margin-bottom:30px;

}

.login-field{

text-align:right;

margin-bottom:20px;

}

.login-field label{

display:block;

font-weight:bold;

margin-bottom:8px;

color:#334155;

}

.login-field input,

.login-field select{

width:100%;

padding:16px;

border:2px solid #e2e8f0;

border-radius:15px;

font-size:16px;

outline:none;

background:white;

}

.login-field input:focus,

.login-field select:focus{

border-color:#1e40af;

}

.password-wrapper{

position:relative;

}

.password-wrapper input{

padding-left:55px;

}

.show-password{

position:absolute;

left:12px;

top:50%;

transform:translateY(-50%);

border:0;

background:none;

font-size:20px;

cursor:pointer;

}

.login-button{

width:100%;

border:0;

cursor:pointer;

margin-top:10px;

}

.login-message{

display:none;

background:#fee2e2;

color:#b91c1c;

padding:14px;

border-radius:14px;

margin-bottom:20px;

font-weight:bold;

}

.teacher-note{

margin-top:20px;

padding:15px;

background:#eff6ff;

border-radius:15px;

color:#1e40af;

font-size:14px;

}

</style>

</head>


<body>


<nav class="navbar">

<a href="index.html" class="brand">

<img src="logo.svg"
alt="لغتي لغة الضاد">

لغتي لغة الضاد

</a>

<div class="nav-links">

<a href="index.html">الرئيسية</a>

<a href="courses.html">المراحل الدراسية</a>

<a href="support.html">الدعم</a>

</div>

</nav>


<main class="login-page">

<section class="login-box">

<img
src="logo.svg"
class="login-logo"
alt="لغتي لغة الضاد">


<h1>
تسجيل الدخول
</h1>


<p class="subtitle">

أهلاً بك في منصة
<strong>لغتي لغة الضاد</strong>

<br>

سجّل الدخول للوصول إلى محتوى المنصة.

</p>


<div
id="loginMessage"
class="login-message">
</div>


<form id="loginForm">


<div class="login-field">

<label for="username">

اسم المستخدم

</label>

<input
type="text"
id="username"
placeholder="اكتب اسم المستخدم"
autocomplete="username"
required>

</div>


<div class="login-field">

<label for="userType">

نوع الحساب

</label>

<select id="userType">

<option value="student">
طالب
</option>

<option value="teacher">
المعلمة
</option>

</select>

</div>


<div
id="teacherPasswordField"
class="login-field"
style="display:none;">

<label for="teacherPassword">

كلمة مرور المعلمة

</label>


<div class="password-wrapper">

<input
type="password"
id="teacherPassword"
placeholder="كلمة مرور المعلمة"
autocomplete="current-password">

<button
type="button"
class="show-password"
onclick="togglePassword()">

👁️

</button>

</div>

</div>


<button
type="submit"
class="main-btn login-button">

دخول إلى المنصة 🚀

</button>


</form>


<div class="teacher-note">

👩‍🏫 حساب المعلمة مخصص لإدارة الدروس والطلاب.

</div>


</section>

</main>


<footer>

<p>
لغتي لغة الضاد © 2026
</p>

<p>
إشراف المعلمة سمر رمضان |
تطوير M11
</p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="login-system.js"></script> 

</body>

</html>

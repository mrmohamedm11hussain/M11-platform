<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - منصتي</title>

<style>

body{
    margin:0;
    background:#f1f5f9;
    font-family:Tahoma,Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{

    background:white;
    width:350px;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px #ddd;
    text-align:center;

}

h1{
    color:#2563eb;
}

input{

    width:90%;
    padding:15px;
    margin:10px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;

}


button{

    width:95%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;

}


button:hover{

    background:#1d4ed8;

}


a{

    display:block;
    margin-top:20px;
    color:#2563eb;

}

</style>

</head>


<body>


<div class="login-box">

<h1>منصتي</h1>

<p>تسجيل الدخول</p>


<input type="email" placeholder="البريد الإلكتروني">


<input type="password" placeholder="كلمة المرور">


<button>
دخول
</button>


<a href="index.html">
العودة للرئيسية
</a>


</div>


</body>

</html>
